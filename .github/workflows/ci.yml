name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI analyze and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d  # v1.8.1
        with:
          sdk: 3.11.4
      # Two suites compile the generated Android Java against stubs.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - run: dart pub get
      # patrol_bundle_template_test.dart (macOS only) uses the globally activated patrol_cli's bundler.
      - run: dart pub global activate patrol_cli 4.8.0
      - run: dart format --output=none --set-exit-if-changed lib test bin
      - run: dart analyze --fatal-infos
      - run: dart test

  harness:
    name: Harness analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/mplatrol_harness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: 3.41.6
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
