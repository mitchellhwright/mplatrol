name: mplatrol
description: >-
  Patrol end-to-end test orchestrator for Flutter apps: local simulators, emulators and devices,
  LambdaTest real devices and HyperExecute, device matrices, retries, failure classification and
  JUnit/JSON reporting.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

executables:
  mplatrol:

dependencies:
  archive: 4.5.2
  args: 2.7.0
  crypto: 3.0.7
  get_it: 9.3.0
  http: 1.6.0
  mason_logger: 0.2.16
  meta: 1.17.0
  path: 1.9.1
  process_run: 0.13.3+1
  pub_semver: 2.2.1
  xml: 6.6.1
  yaml: 3.1.4
  yaml_edit: 2.2.4

dev_dependencies:
  fake_async: 1.3.3
  lints: 6.1.0
  mocktail: 1.0.5
  test: 1.31.1
